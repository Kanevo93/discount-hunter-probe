name: probe

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx curl_cffi
      - name: Run probe
        env:
          GO_COOKIE: ${{ secrets.GO_COOKIE }}
        run: python app.py --cli
